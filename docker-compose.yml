services:
  file-server:
    build:
      context: ..
      dockerfile: services/file-server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      STORAGE_SERVICE_ADDR: "storage-service:50051"
    depends_on:
      - storage-service

  storage-service:
    build:
      context: ..
      dockerfile: services/storage-service/Dockerfile
    ports:
      - "50051:50051"
    environment:
      GRPC_PORT: "50051"
      STORAGE_PATH: "/data/files"

      DATABASE_URL: "postgres://file_user:file_password@postgres:5432/file_management?sslmode=disable"

    volumes:
      - file-data:/data

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: file_management
      POSTGRES_USER: file_user
      POSTGRES_PASSWORD: file_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U file_user -d file_management
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  file-data:
  postgres-data:
