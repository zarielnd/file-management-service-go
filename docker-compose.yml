services:
  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./services/storage/db/migrations:/migrations
    command: ["-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  file-server:
    build:
      context: .
      dockerfile: services/file-server/Dockerfile
      provenance: false
      sbom: false
    ports:
      - "${HOST_HTTP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      STORAGE_GRPC_TARGET: "storage-service:50051"
      MAX_UPLOAD_SIZE: "${MAX_UPLOAD_SIZE}"
    depends_on:
      storage-service:
        condition: service_healthy

  storage-service:
    build:
      context: .
      dockerfile: services/storage/Dockerfile
      provenance: false
      sbom: false
    ports:
      - "${HOST_GRPC_PORT:-50051}:50051"
    environment:
      GRPC_PORT: "50051"
      DATABASE_URL: "${DATABASE_URL}"
      STORAGE_BACKEND: "${STORAGE_BACKEND}"
      # Local
      STORAGE_PATH: "${STORAGE_PATH}"
      TEMP_PATH: "${TEMP_PATH}"
      # S3
      S3_ENDPOINT: "${S3_ENDPOINT}"
      S3_REGION: "${S3_REGION}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE}"
    volumes:
      # Only needed for local backend; harmless for S3
      - file-data:/data
    healthcheck:
      test: ["CMD", "/app/grpc_health_probe", "-addr=:50051"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY}"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Optional: auto-create bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb local/${S3_BUCKET} --ignore-existing
      "

volumes:
  file-data:
  postgres-data:
  minio-data:
