services:
  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./services/storage/db/migrations:/migrations
    command: ["-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  file-server:
    build:
      context: .
      dockerfile: services/file-server/Dockerfile
      provenance: false
      sbom: false
    ports:
      - "${HOST_HTTP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      STORAGE_GRPC_TARGET: "storage-service:50051"
      MAX_UPLOAD_SIZE: "${MAX_UPLOAD_SIZE}"
    depends_on:
      storage-service:
        condition: service_healthy

  storage-service:
    build:
      context: .
      dockerfile: services/storage/Dockerfile
      provenance: false
      sbom: false
    ports:
      - "${HOST_GRPC_PORT:-50051}:50051"
    environment:
      GRPC_PORT: "50051"
      STORAGE_PATH: "${STORAGE_PATH}"
      DATABASE_URL: "${DATABASE_URL}"
    volumes:
      - file-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  file-data:
  postgres-data:
