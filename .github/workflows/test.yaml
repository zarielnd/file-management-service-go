name: Test Pipeline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Test file-server
        working-directory: services/file-server
        run: go test -race ./...

      - name: Test storage
        working-directory: services/storage
        run: go test -race ./...
